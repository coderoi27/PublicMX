# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.core_api_base_url: '%env(default::CORE_API_BASE_URL)%'
    app.google_maps_api_key: '%env(default::GOOGLE_MAPS_API_KEY)%'
    app.alpha_invite_required: '%env(bool:default::PUBLIC_ALPHA_INVITE_REQUIRED)%'
    app.walkthrough_enabled: '%env(bool:default::PUBLIC_WALKTHROUGH_ENABLED)%'
    app.alpha_from_email: '%env(default::PUBLIC_ALPHA_FROM_EMAIL)%'
    app.alpha_from_name: '%env(default::PUBLIC_ALPHA_FROM_NAME)%'
    app.alpha_invitation_expiry_days: '%env(int:default::PUBLIC_ALPHA_INVITATION_EXPIRY_DAYS)%'
    app.mailer_dsn: '%env(default::MAILER_DSN)%'
    
    # Core API configs for Claim flow
    app.mi_monchis_core_base_url: '%env(string:MI_MONCHIS_CORE_BASE_URL)%'
    app.mi_monchis_core_timeout_seconds: '%env(int:MI_MONCHIS_CORE_TIMEOUT_SECONDS)%'
    app.mi_monchis_core_connect_timeout_seconds: '%env(int:MI_MONCHIS_CORE_CONNECT_TIMEOUT_SECONDS)%'
    app.claim_legal_acceptance_reference: '%env(string:CLAIM_LEGAL_ACCEPTANCE_REFERENCE)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\Public\CoreFeedClient:
        arguments:
            $coreApiBaseUrl: '%app.core_api_base_url%'

    App\Service\Public\AlphaAccessClient:
        arguments:
            $coreApiBaseUrl: '%app.core_api_base_url%'

    App\Service\Public\InvitationRequestClient:
        arguments:
            $coreApiBaseUrl: '%app.core_api_base_url%'

    App\Service\Public\BlockedEmailDomainClient:
        arguments:
            $coreApiBaseUrl: '%app.core_api_base_url%'

    App\Service\Public\LocationClaimClient:
        arguments:
            $coreApiBaseUrl: '%app.core_api_base_url%'

    App\Service\Public\EventLogClient:
        arguments:
            $coreApiBaseUrl: '%app.core_api_base_url%'

    App\Service\Public\LegalDocumentClient:
        arguments:
            $coreApiBaseUrl: '%app.core_api_base_url%'

    App\Service\Public\GooglePlacesClient:
        arguments:
            $googlePlacesApiKey: '%app.google_maps_api_key%'
            $requestStack: '@request_stack'

    App\Service\Claim\LocationClaimCoreClient:
        arguments:
            $coreBaseUrl: '%app.mi_monchis_core_base_url%'
            $timeout: '%app.mi_monchis_core_timeout_seconds%'
